# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# SYNTRA-specific AI review policy.
language: "en-US"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - "main"
  path_filters:
    - "!docs/assets/**"
  path_instructions:
    - path: "local/**"
      instructions: |
        Prioritize correctness and security across the local API, chat routing,
        repository agent, diagnostics, model-provider integrations, and persistence.
        Trace request data through validation, authorization, tool dispatch, and output.
        Flag authentication or origin-policy bypasses, unsafe path handling, symlink
        escapes, workspace-boundary violations, secret leakage, unbounded resource
        use, race conditions, and misleading success or verification states.
        Do not recommend unrestricted command execution or weakening permission gates.
    - path: "syntra_ai/**"
      instructions: |
        Review model and training code for data integrity, deterministic behavior,
        path containment, safe loading, resource limits, dependency assumptions,
        and accurate reporting of model capabilities. Distinguish mocked tests from
        validation against a real model or runtime.
    - path: "scripts/**"
      instructions: |
        Pay particular attention to subprocess invocation, argument validation,
        shell usage, environment-variable inheritance, filesystem operations,
        cross-platform behavior, cleanup reliability, and fail-closed behavior.
        Never recommend bypassing hash verification or the repository's execution
        isolation controls to make a check pass.
    - path: "tests/**"
      instructions: |
        Check that tests exercise production behavior and meaningful failure paths.
        Look for assertions that can pass without proving the intended security or
        correctness property. Do not treat mocked integrations as proof of live
        provider, model, Docker, or operating-system behavior.
    - path: ".github/workflows/**"
      instructions: |
        Review workflow permissions using least privilege. Check untrusted pull
        request data handling, write-capable tokens, third-party actions, dependency
        supply-chain exposure, branch filters, artifact handling, and whether
        security checks fail closed without exposing secrets.
    - path: "**/*.{js,mjs,cjs,ts,tsx,py,ps1,yml,yaml,json}"
      instructions: |
        Prioritize exploitable defects, data loss, regressions, security-boundary
        violations, portability issues, and missing regression coverage. Report
        concrete findings with affected code paths and realistic impact. Separate
        confirmed defects from assumptions; avoid style-only and speculative comments.

chat:
  auto_reply: true
