<text x="58" y="62" fill="#f1f5ff" font-family="Inter,Segoe UI,Arial" font-size="26" font-weight="700">A local stack. A controlled engineering loop.</text>
<text x="58" y="91" fill="#92a2ba" font-family="Inter,Segoe UI,Arial" font-size="14">The browser, orchestration service, model runtime and project workspace stay on the user's machine.</text>
