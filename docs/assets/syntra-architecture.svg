<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-labelledby="title desc">
<title id="title">SYNTRA local-first architecture</title><desc id="desc">React and Vite connect to a loopback Node service, which coordinates local model inference, repository intelligence, isolated verification and user-approved proposal application.</desc>
