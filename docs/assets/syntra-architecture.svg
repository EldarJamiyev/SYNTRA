<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">SYNTRA system architecture</title>
  <desc id="desc">The React chat interface sends user requests to loopback Node orchestration. The orchestrator uses bounded workspace tools and a selected inference engine, then validates and stages reviewable patches.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#101b31"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#91b6ff"/></marker>
    <style>
      .h{font:700 24px Inter,Segoe UI,Arial,sans-serif;fill:#f1f5ff}
      .t{font:600 18px Inter,Segoe UI,Arial,sans-serif;fill:#edf3ff}
      .s{font:14px Inter,Segoe UI,Arial,sans-serif;fill:#aab9cf}
      .k{font:700 12px Inter,Segoe UI,Arial,sans-serif;letter-spacing:1.5px;fill:#9fb4d4}
      .node{fill:#12213a;stroke:#456184;stroke-width:1.5}
      .line{fill:none;stroke:#91b6ff;stroke-width:2;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#8be9dc;stroke-width:2;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="820" rx="28" fill="url(#bg)"/>
  <g opacity=".22" fill="none" stroke="#8aa8d1"><path d="M0 120H1440M0 240H1440M0 360H1440M0 480H1440M0 600H1440M0 720H1440"/><path d="M120 0V820M240 0V820M360 0V820M480 0V820M600 0V820M720 0V820M840 0V820M960 0V820M1080 0V820M1200 0V820M1320 0V820"/></g>
  <text x="72" y="76" class="k">SYNTRA · PRODUCTION PATH</text>
  <text x="72" y="118" class="h" font-size="34">One controlled agent. Two explicit inference choices.</text>
  <text x="72" y="151" class="s">Provider selection changes model inference only. Workspace access, approvals, and verification stay in SYNTRA.</text>
  <rect x="72" y="210" width="260" height="130" rx="18" class="node"/>
  <text x="100" y="252" class="k">USER INTERFACE</text>
  <text x="100" y="290" class="t">React + TypeScript</text>
  <text x="100" y="317" class="s">Chat · sessions · workspace</text>
  <rect x="408" y="210" width="320" height="130" rx="18" class="node"/>
  <text x="436" y="252" class="k">LOCAL ORCHESTRATION</text>
  <text x="436" y="290" class="t">Node.js loopback API</text>
  <text x="436" y="317" class="s">Intent · retrieval · agent runs</text>
  <rect x="804" y="180" width="270" height="105" rx="18" class="node"/>
  <text x="832" y="218" class="k">NATIVE DEFAULT</text>
  <text x="832" y="254" class="t">SYNTRA PyTorch</text>
  <text x="832" y="275" class="s">Local checkpoint · training</text>
  <rect x="1120" y="180" width="250" height="105" rx="18" class="node" stroke="#8c9fff"/>
  <text x="1148" y="218" class="k">OPT-IN ONLY</text>
  <text x="1148" y="254" class="t">Compatible endpoint</text>
  <text x="1148" y="275" class="s">Exact model ID · HTTPS opt-in</text>
  <rect x="804" y="330" width="566" height="78" rx="16" fill="#18233b" stroke="#8975b7" stroke-width="1.5"/>
  <text x="832" y="362" class="k">BOUNDED WORKSPACE TOOLS</text>
  <text x="832" y="390" class="t">Search · read · symbols · memory · diagnostics</text>
  <rect x="408" y="500" width="320" height="118" rx="18" class="node"/>
  <text x="436" y="540" class="k">PATCH PIPELINE</text>
  <text x="436" y="578" class="t">Structured candidate edits</text>
  <text x="436" y="600" class="s">Source hashes · review · proposals</text>
  <rect x="804" y="500" width="566" height="118" rx="18" class="node"/>
  <text x="832" y="540" class="k">VERIFICATION &amp; TRUST BOUNDARY</text>
  <text x="832" y="578" class="t">Isolated checks · result evidence · user approval</text>
  <text x="832" y="600" class="s">No auto-apply for unverified proposals</text>
  <path d="M332 275H408" class="line"/>
  <path d="M728 255C760 255 770 232 804 232" class="line"/>
  <path d="M728 290C765 290 770 380 804 380" class="line"/>
  <path d="M1074 232H1120" class="dash"/>
  <text x="1086" y="160" class="k" text-anchor="middle">OR</text>
  <path d="M1080 285V330" class="line"/>
  <path d="M728 565H804" class="line"/>
  <path d="M967 408V500" class="line"/>
  <path d="M728 340V450H568V500" class="line"/>
  <path d="M1080 618V680H568V618" class="dash"/>
  <rect x="72" y="680" width="1298" height="74" rx="16" fill="#0d192b" stroke="#344c6e"/>
  <text x="100" y="710" class="k">EVIDENCE RULE</text>
  <text x="100" y="737" class="s">CI proves application behavior. Only a real checkpoint/endpoint benchmark run proves model task outcomes. Missing measurements remain unpublished.</text>
  <text x="1368" y="790" class="s" text-anchor="end">LOCAL-FIRST · EXPLICIT PROVIDERS · HUMAN-APPROVED</text>
</svg>