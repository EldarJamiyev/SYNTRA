<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="390" viewBox="0 0 1280 390" role="img" aria-labelledby="title desc">
<title id="title">SYNTRA benchmark coverage</title><desc id="desc">Eight coding benchmark fixtures across JavaScript utilities, configuration, API validation, Python and TypeScript with exact path and verified completion scoring.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#171a2d"/></linearGradient>
 <linearGradient id="mint" x2="1"><stop stop-color="#7be4cf"/><stop offset="1" stop-color="#65bdc9"/></linearGradient>
 <linearGradient id="violet" x2="1"><stop stop-color="#b9a2ff"/><stop offset="1" stop-color="#8497ef"/></linearGradient>
</defs>
<rect width="1280" height="390" rx="24" fill="url(#bg)"/>
<text x="54" y="58" fill="#f3f5ff" font-family="Inter,Segoe UI,Arial" font-size="25" font-weight="700">Measured against real, failing project fixtures</text>
<text x="54" y="86" fill="#98a8c1" font-family="Inter,Segoe UI,Arial" font-size="14">Benchmark suite v1.4.0 · task-scoped acceptance · no synthetic success claims</text>
<g font-family="Inter,Segoe UI,Arial">
 <rect x="54" y="126" width="210" height="198" rx="16" fill="#152c2d" stroke="#75d7c4" stroke-opacity=".65"/>
 <text x="78" y="165" fill="#a7f0df" font-size="12" font-weight="700" letter-spacing="1.5">TASK FIXTURES</text>
 <text x="78" y="236" fill="#f0fffb" font-size="64" font-weight="760">08</text>
 <text x="78" y="273" fill="#a9c8c2" font-size="13">JavaScript · Python</text><text x="78" y="294" fill="#a9c8c2" font-size="13">TypeScript · multi-file API</text>
 <rect x="286" y="126" width="274" height="198" rx="16" fill="#18253b" stroke="#82aaff" stroke-opacity=".65"/>
 <text x="310" y="165" fill="#b5ceff" font-size="12" font-weight="700" letter-spacing="1.5">BASELINE GATE</text>
 <text x="310" y="203" fill="#f0f5ff" font-size="19" font-weight="700">Expected failure</text>
 <text x="310" y="232" fill="#b1c1d8" font-size="13">A task must fail for its</text><text x="310" y="252" fill="#b1c1d8" font-size="13">declared diagnostic before</text><text x="310" y="272" fill="#b1c1d8" font-size="13">the model is invoked.</text>
 <rect x="582" y="126" width="274" height="198" rx="16" fill="#24243d" stroke="#aa9be9" stroke-opacity=".65"/>
 <text x="606" y="165" fill="#d4c7ff" font-size="12" font-weight="700" letter-spacing="1.5">PATCH ACCEPTANCE</text>
 <text x="606" y="203" fill="#f6f2ff" font-size="19" font-weight="700">Exact file set</text>
 <text x="606" y="232" fill="#c1b9d9" font-size="13">The changed-file list must</text><text x="606" y="252" fill="#c1b9d9" font-size="13">match the task's declared</text><text x="606" y="272" fill="#c1b9d9" font-size="13">paths without extra edits.</text>
 <rect x="878" y="126" width="348" height="198" rx="16" fill="#202b33" stroke="#80d8d2" stroke-opacity=".65"/>
 <text x="902" y="165" fill="#a7ece5" font-size="12" font-weight="700" letter-spacing="1.5">COMPLETION RULE</text>
 <g transform="translate(902 190)"><circle cx="11" cy="11" r="10" fill="url(#mint)"/><path d="M6 11l4 4 7-8" stroke="#09201e" stroke-width="2" fill="none"/><text x="31" y="16" fill="#e7f9f7" font-size="14">Validated failing baseline</text></g>
 <g transform="translate(902 231)"><circle cx="11" cy="11" r="10" fill="url(#mint)"/><path d="M6 11l4 4 7-8" stroke="#09201e" stroke-width="2" fill="none"/><text x="31" y="16" fill="#e7f9f7" font-size="14">Exact expected file changes</text></g>
 <g transform="translate(902 272)"><circle cx="11" cy="11" r="10" fill="url(#mint)"/><path d="M6 11l4 4 7-8" stroke="#09201e" stroke-width="2" fill="none"/><text x="31" y="16" fill="#e7f9f7" font-size="14">Candidate verification passes</text></g>
 <text x="54" y="361" fill="#8192ad" font-size="12">The suite measures these fixtures only; it is not a claim of general coding ability or frontier-model equivalence.</text>
</g>
</svg>