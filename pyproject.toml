[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syntra-ai"
version = "0.1.0"
description = "A coding-focused language model trained from random initialization"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Eldar Jamiyev" }]
dependencies = [
    "torch>=2.2,<3.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
syntra = "syntra.cli:main"

[tool.setuptools.packages.find]
include = ["syntra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
