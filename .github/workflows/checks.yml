name: SYNTRA checks

permissions:
  contents: read

on:
  push:
    branches: [main, "hardening/**", "feat/engineering-intelligence-upgrade"]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test

  native-model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Install pinned lock compiler
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - name: Verify the universal Python lock is current
        run: |
          uv pip compile --universal --generate-hashes --emit-index-url --torch-backend=cpu requirements.txt --output-file requirements.lock.txt
          git diff --exit-code -- requirements.lock.txt
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip check
      - run: python -c "import numpy, torch; assert torch.version.cuda is None, 'Expected CPU-only PyTorch'; print('NumPy', numpy.__version__, 'PyTorch', torch.__version__, 'CUDA', torch.version.cuda)"
      - run: python -m compileall -q brain syntra_ai tests/python scripts
      - run: python -m unittest discover -s tests/python -v
      - run: python scripts/run_syntra_module.py cli status

  python-lock-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip check
      - run: python -c "import numpy, torch; assert torch.version.cuda is None, 'Expected CPU-only PyTorch'; print('NumPy', numpy.__version__, 'PyTorch', torch.__version__, 'CUDA', torch.version.cuda)"
  windows-launcher-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install frontend and runtime dependencies for Windows regression tests
        run: npm ci --ignore-scripts --no-audit
      - name: Parse PowerShell launcher and verify one-click entry point
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "scripts/start-syntra.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          if (-not (Test-Path "Start-SYNTRA.bat")) { throw "Start-SYNTRA.bat is missing." }
          if (-not (Test-Path "package-lock.json")) { throw "Committed npm package-lock.json is missing." }
          if (-not (Test-Path "requirements.lock.txt")) { throw "Committed Python requirements.lock.txt is missing." }
          $pythonInstallerText = Get-Content "scripts/setup_syntra_env.py" -Raw
          if (-not $pythonInstallerText.Contains("--require-hashes")) { throw "Native Python installer must enforce requirements.lock.txt hashes." }
          $launcherText = Get-Content "scripts/start-syntra.ps1" -Raw
          if (-not $launcherText.Contains("npm ci")) { throw "Windows launcher must install frontend dependencies with npm ci." }
          if ($launcherText.Contains("npm install")) { throw "Windows launcher must not resolve unpinned npm dependencies with npm install." }
          if (-not (Test-Path "scripts/launcher-helpers.ps1")) { throw "Windows launcher helper module is missing." }
          if (-not (Test-Path "tests/windows-launcher.test.ps1")) { throw "Windows launcher behavior tests are missing." }
          & ./tests/windows-launcher.test.ps1
          if (-not (Test-Path "tests/frontend.test.mjs")) { throw "Minimal chat frontend regression test is missing." }
          node scripts/run-node-tests.mjs
          if ($LASTEXITCODE -ne 0) { throw "Node.js regression suite failed on Windows." }
          if (-not (Test-Path "local/model-provider.mjs")) { throw "Local model routing module is missing." }
          $package = Get-Content "package.json" -Raw | ConvertFrom-Json
          if ($package.scripts.'ai:cli' -ne "python scripts/run_syntra_module.py cli") { throw "The AI CLI launcher mapping is incorrect." }
          if ($package.scripts.'ai:server' -ne "python scripts/run_syntra_module.py server") { throw "The AI server launcher mapping is incorrect." }
          if (-not $package.dependencies.react -or -not $package.dependencies.'react-dom' -or -not $package.dependencies.'react-markdown' -or -not $package.dependencies.'remark-gfm' -or -not $package.dependencies.typescript -or -not $package.devDependencies.vite) { throw "Required frontend dependencies are missing from package.json." }
          if ((Get-Content "requirements.txt" -Raw) -notmatch "numpy") { throw "NumPy is not listed in requirements.txt." }
          Write-Host "PowerShell launcher syntax and one-click entry point are valid."

  browser-e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      - name: Install Chromium and Linux browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Run real-browser chat and history journeys
        run: npm run test:e2e
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
