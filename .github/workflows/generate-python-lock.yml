name: Generate Python dependency lock

on:
  push:
    branches: [feat/engineering-intelligence-upgrade]
    paths:
      - requirements.txt
      - .github/workflows/generate-python-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    if: github.ref == 'refs/heads/feat/engineering-intelligence-upgrade'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned uv lock compiler
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - name: Generate a universal hash-locked requirements file
        run: uv pip compile --universal --generate-hashes --emit-index-url --torch-backend=cpu requirements.txt --output-file requirements.lock.txt
      - name: Validate hash-locked CPU PyTorch installation
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements.lock.txt
          .venv/bin/python -m pip check
          .venv/bin/python -c "import numpy, torch; assert torch.version.cuda is None, 'Expected CPU-only PyTorch'; print('NumPy', numpy.__version__, 'PyTorch', torch.__version__, 'CUDA', torch.version.cuda)"
      - name: Commit the verified lockfile to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock.txt
          if git diff --cached --quiet; then
            echo "Python requirements lockfile is already up to date."
          else
            git commit -m "build: add universal hash-locked Python dependencies"
            git push origin HEAD:refs/heads/feat/engineering-intelligence-upgrade
          fi
