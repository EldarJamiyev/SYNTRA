name: SYNTRA dependency audit

on:
  push:
    branches: [main, "hardening/**", "feat/engineering-intelligence-upgrade"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install reproducible locked dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Fail on high or critical npm advisories
        run: npm audit --audit-level=high
