name: SYNTRA dependency audit

on:
  push:
    branches: [main, "hardening/**", "feat/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Generate an npm lockfile when none is committed
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit
          fi
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Fail on high or critical npm advisories
        run: npm audit --audit-level=high
  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit the exact hashed CPU-only Python dependency lock
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.lock.txt
          require-hashes: true
          summary: true
